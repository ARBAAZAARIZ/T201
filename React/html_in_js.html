<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Document</title>
</head>
<body>
    
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- step 2 adbabel to your project -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <script type="text/babel">
    let root=document.getElementById("root");
    // step 2 - create react component
    function Display(){
        return <h1>converted using babel</h1>
    }

    // step 3 rendering/displaying created component
    let mainRoot=ReactDOM.createRoot(root);
    mainRoot.render(<Display/>)
       

    // render() expect element so we have to convert our component into element
  </script>

</body>
</html>
